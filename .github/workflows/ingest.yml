name: Update F1 session data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh the calendar now"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: f1-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      F1_INGEST_URL: ${{ secrets.F1_INGEST_URL }}
      F1_INGEST_TOKEN: ${{ secrets.F1_INGEST_TOKEN }}
      REQUESTED_FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Restore bounded FastF1 cache
        uses: actions/cache@v4
        with:
          path: fastf1_cache
          key: fastf1-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fastf1-v1-${{ runner.os }}-
      - run: pip install -r pipeline/requirements.txt
      - name: Refresh calendar (analysis runs in the durable Vercel queue)
        shell: bash
        run: |
          args=(--calendar-only)
          if [ "$REQUESTED_FORCE" = "true" ]; then args+=(--force); fi
          python -m pipeline.ingest "${args[@]}"
